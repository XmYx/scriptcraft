[package]
name = "scriptcraft-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ScriptCraft PDF export: the layout's pages drawn with craft-libs craft-pdf, font embedded. No UI."
publish = false

[lints]
workspace = true

[dependencies]
scriptcraft-layout = { workspace = true }
scriptcraft-model = { workspace = true }
craft-pdf = { workspace = true, features = ["write", "write-simple-text"] }
thiserror = { workspace = true }

[dev-dependencies]
scriptcraft-fountain = { workspace = true }
scriptcraft-fonts = { workspace = true }
